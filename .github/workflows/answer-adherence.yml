name: answer-adherence

on:
  pull_request:
    paths: ["api/**", "web/public/data/**"]
  push:
    branches: [main]

jobs:
  answer-adherence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile main.py test_answer_adherence.py
      - name: Answer-adherence suite (offline)
        run: python test_answer_adherence.py